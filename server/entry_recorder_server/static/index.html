<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entry Recorder Server</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent-red: #ef4444;
            --accent-green: #22c55e;
            --accent-amber: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--card-border);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            padding: 0.5rem;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-title {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            text-decoration: none;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-main);
        }

        .btn-outline:hover {
            background-color: var(--card-bg);
        }

        .btn-danger {
            background-color: var(--accent-red);
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }

        main {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
        }

        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 0.75rem;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        /* Section styles */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        /* Active Recordings */
        .active-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .active-card {
            background: linear-gradient(90deg, rgba(239, 68, 68, 0.15), rgba(30, 41, 59, 0.9));
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 0.75rem;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .recording-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: var(--accent-red);
            border-radius: 50%;
            margin-right: 0.5rem;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Filters */
        .filter-bar {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 0.75rem;
            padding: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
        }

        .filter-input, .filter-select {
            background-color: var(--bg-color);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            outline: none;
        }

        .filter-input:focus, .filter-select:focus {
            border-color: var(--primary);
        }

        /* Video Grid */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .video-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 0.75rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.15s, border-color 0.15s;
        }

        .video-card:hover {
            transform: translateY(-2px);
            border-color: #475569;
        }

        .thumb-container {
            position: relative;
            width: 100%;
            height: 180px;
            background-color: #020617;
            cursor: pointer;
        }

        .thumb-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.6);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            transition: background-color 0.2s, transform 0.2s;
        }

        .thumb-container:hover .play-overlay {
            background-color: var(--primary);
            transform: translate(-50%, -50%) scale(1.1);
        }

        .event-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            padding: 0.25rem 0.5rem;
            border-radius: 0.375rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-RING { background-color: var(--accent-red); color: white; }
        .badge-MOTION { background-color: var(--accent-amber); color: #0f172a; }
        .badge-MANUAL { background-color: var(--primary); color: white; }

        .duration-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background-color: rgba(0, 0, 0, 0.75);
            padding: 0.2rem 0.4rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
        }

        .card-details {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex: 1;
        }

        .card-title {
            font-weight: 600;
            font-size: 1rem;
        }

        .card-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .card-actions {
            border-top: 1px solid var(--card-border);
            padding: 0.75rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0.25rem 0.5rem;
            border-radius: 0.375rem;
            transition: color 0.15s, background-color 0.15s;
        }

        .icon-btn:hover {
            color: var(--text-main);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .icon-btn.active {
            color: var(--accent-amber);
        }

        .icon-btn.danger:hover {
            color: var(--accent-red);
        }

        /* Modal */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 1rem;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal-dialog {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 0.75rem;
            width: 100%;
            max-width: 800px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .video-player {
            width: 100%;
            max-height: 480px;
            background-color: black;
            border-radius: 0.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.375rem;
        }

        .form-group label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .form-control {
            background-color: var(--bg-color);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.6rem 0.8rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-area">
            <div class="logo-icon">📹</div>
            <div>
                <div class="logo-title">Entry Recorder Server</div>
                <div style="font-size: 0.75rem; color: var(--text-muted);">Central Intercom Recording Hub</div>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn btn-outline" onclick="triggerCleanup()">🧹 Run Cleanup</button>
            <button class="btn" onclick="openTriggerModal()">➕ Start Recording</button>
        </div>
    </header>

    <main>
        <!-- Statistics -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Active Recordings</div>
                <div class="stat-value" id="stat-active">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Recordings</div>
                <div class="stat-value" id="stat-total">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Storage Used</div>
                <div class="stat-value" id="stat-storage">0 MB</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Server Version</div>
                <div class="stat-value" id="stat-version">v1.0.0</div>
            </div>
        </div>

        <!-- Active Recordings Container -->
        <div id="active-recordings-section" style="display: none;">
            <div class="section-header">
                <div class="section-title">🔴 Ongoing Recordings</div>
            </div>
            <div class="active-list" id="active-recordings-list"></div>
        </div>

        <!-- Recordings Archive Section -->
        <div>
            <div class="section-header">
                <div class="section-title">Recordings Archive</div>
            </div>

            <!-- Filter Toolbar -->
            <div class="filter-bar">
                <input type="text" id="filter-search" class="filter-input" placeholder="Search device name..." oninput="filterRecordings()" style="flex: 1; min-width: 200px;">
                <select id="filter-event" class="filter-select" onchange="filterRecordings()">
                    <option value="">All Events</option>
                    <option value="RING">🔔 Doorbell Ring</option>
                    <option value="MOTION">👁 Motion</option>
                    <option value="MANUAL">🖐 Manual</option>
                </select>
                <button class="btn btn-outline" onclick="loadData()">🔄 Refresh</button>
            </div>
        </div>

        <!-- Video Cards Grid -->
        <div class="video-grid" id="recordings-grid">
            <div class="empty-state">Loading recordings...</div>
        </div>
    </main>

    <!-- Video Playback Modal -->
    <div id="player-modal" class="modal-backdrop">
        <div class="modal-dialog">
            <div class="modal-header">
                <div id="modal-title" style="font-weight: 600;">Video Playback</div>
                <button class="icon-btn" onclick="closePlayerModal()">✕</button>
            </div>
            <div class="modal-body">
                <video id="video-element" class="video-player" controls autoplay playsinline></video>
                <div id="modal-meta" style="font-size: 0.875rem; color: var(--text-muted);"></div>
            </div>
        </div>
    </div>

    <!-- Start Recording Trigger Modal -->
    <div id="trigger-modal" class="modal-backdrop">
        <div class="modal-dialog" style="max-width: 500px;">
            <div class="modal-header">
                <div style="font-weight: 600;">Trigger Server Recording</div>
                <button class="icon-btn" onclick="closeTriggerModal()">✕</button>
            </div>
            <form onsubmit="submitTriggerRecording(event)">
                <div class="modal-body">
                    <div class="form-group">
                        <label>Device ID</label>
                        <input type="number" id="trig-device-id" class="form-control" value="1" required>
                    </div>
                    <div class="form-group">
                        <label>Device Name</label>
                        <input type="text" id="trig-device-name" class="form-control" value="Front Door 2N Verso" required>
                    </div>
                    <div class="form-group">
                        <label>RTSP Stream URL</label>
                        <input type="text" id="trig-rtsp" class="form-control" placeholder="rtsp://admin:pass@192.168.1.100:554/live.sdp">
                    </div>
                    <div class="form-group">
                        <label>Snapshot URL (Fallback if RTSP unavail)</label>
                        <input type="text" id="trig-snapshot" class="form-control" placeholder="http://192.168.1.100/api/camera/snapshot">
                    </div>
                    <div class="form-group">
                        <label>Event Type</label>
                        <select id="trig-event" class="form-control">
                            <option value="RING">Doorbell Ring</option>
                            <option value="MOTION">Motion</option>
                            <option value="MANUAL" selected>Manual Trigger</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Duration (Seconds)</label>
                        <input type="number" id="trig-duration" class="form-control" value="30" min="5" max="300">
                    </div>
                </div>
                <div class="modal-header" style="border-top: 1px solid var(--card-border); justify-content: flex-end; gap: 0.5rem;">
                    <button type="button" class="btn btn-outline" onclick="closeTriggerModal()">Cancel</button>
                    <button type="submit" class="btn">Start Recording</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let allRecordings = [];

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function formatTimestamp(ms) {
            const date = new Date(ms);
            return date.toLocaleString();
        }

        async function loadData() {
            try {
                const statusRes = await fetch('/api/status');
                const status = await statusRes.json();

                document.getElementById('stat-active').textContent = status.active_recordings_count;
                document.getElementById('stat-total').textContent = status.total_recordings_count;
                document.getElementById('stat-storage').textContent = formatBytes(status.total_storage_bytes);
                document.getElementById('stat-version').textContent = 'v' + status.version;

                // Render active
                const activeSec = document.getElementById('active-recordings-section');
                const activeList = document.getElementById('active-recordings-list');
                if (status.active_recordings && status.active_recordings.length > 0) {
                    activeSec.style.display = 'block';
                    activeList.innerHTML = status.active_recordings.map(rec => `
                        <div class="active-card">
                            <div>
                                <span class="recording-indicator"></span>
                                <strong>${rec.device_name}</strong> &bull; ${rec.event_type} (${rec.elapsed_seconds}s / max ${rec.max_duration_seconds}s)
                            </div>
                            <button class="btn btn-danger" onclick="stopRecording(${rec.device_id})">Stop</button>
                        </div>
                    `).join('');
                } else {
                    activeSec.style.display = 'none';
                    activeList.innerHTML = '';
                }

                // Load recordings
                const recRes = await fetch('/api/recordings?limit=200');
                allRecordings = await recRes.json();
                filterRecordings();
            } catch (err) {
                console.error("Failed to load server data", err);
            }
        }

        function filterRecordings() {
            const query = document.getElementById('filter-search').value.toLowerCase();
            const eventType = document.getElementById('filter-event').value;

            const filtered = allRecordings.filter(rec => {
                const matchesQuery = !query || rec.device_name.toLowerCase().includes(query) || (rec.note && rec.note.toLowerCase().includes(query));
                const matchesEvent = !eventType || rec.event_type === eventType;
                return matchesQuery && matchesEvent;
            });

            renderRecordings(filtered);
        }

        function renderRecordings(recordings) {
            const grid = document.getElementById('recordings-grid');
            if (recordings.length === 0) {
                grid.innerHTML = '<div class="empty-state">No recordings found.</div>';
                return;
            }

            grid.innerHTML = recordings.map(rec => `
                <div class="video-card">
                    <div class="thumb-container" onclick="openPlayerModal(${rec.id})">
                        <img class="thumb-img" src="${rec.thumbnail_url || ''}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'320\' height=\'180\' fill=\'%231e293b\'><rect width=\'320\' height=\'180\'/><text x=\'50%\' y=\'50%\' fill=\'%2364748b\' dominant-baseline=\'middle\' text-anchor=\'middle\'>No Thumbnail</text></svg>'">
                        <div class="play-overlay">▶</div>
                        <span class="event-badge badge-${rec.event_type}">${rec.event_type}</span>
                        <span class="duration-badge">${rec.duration_seconds}s</span>
                    </div>
                    <div class="card-details">
                        <div class="card-title">${rec.device_name}</div>
                        <div class="card-meta">
                            <span>📅 ${formatTimestamp(rec.timestamp)}</span>
                            <span>💾 ${formatBytes(rec.file_size_bytes)}</span>
                        </div>
                        ${rec.note ? `<div style="font-size:0.8rem; color:#cbd5e1;">${rec.note}</div>` : ''}
                    </div>
                    <div class="card-actions">
                        <button class="icon-btn ${rec.is_protected ? 'active' : ''}" onclick="toggleProtect(${rec.id}, ${!rec.is_protected})" title="Protect from Auto-Cleanup">
                            ${rec.is_protected ? '⭐ Protected' : '☆ Protect'}
                        </button>
                        <div style="display: flex; gap: 0.25rem;">
                            <a class="icon-btn" href="${rec.video_url}" download title="Download Video">⬇️</a>
                            <button class="icon-btn danger" onclick="deleteRecording(${rec.id})" title="Delete Recording">🗑️</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openPlayerModal(recId) {
            const rec = allRecordings.find(r => r.id === recId);
            if (!rec) return;

            document.getElementById('modal-title').textContent = `${rec.device_name} - ${rec.event_type}`;
            document.getElementById('modal-meta').textContent = `${formatTimestamp(rec.timestamp)} &bull; ${rec.duration_seconds}s &bull; ${formatBytes(rec.file_size_bytes)}`;
            const video = document.getElementById('video-element');
            video.src = rec.video_url;
            document.getElementById('player-modal').classList.add('open');
        }

        function closePlayerModal() {
            const video = document.getElementById('video-element');
            video.pause();
            video.src = '';
            document.getElementById('player-modal').classList.remove('open');
        }

        function openTriggerModal() {
            document.getElementById('trigger-modal').classList.add('open');
        }

        function closeTriggerModal() {
            document.getElementById('trigger-modal').classList.remove('open');
        }

        async function submitTriggerRecording(e) {
            e.preventDefault();
            const payload = {
                device_id: parseInt(document.getElementById('trig-device-id').value),
                device_name: document.getElementById('trig-device-name').value,
                rtsp_url: document.getElementById('trig-rtsp').value || null,
                snapshot_url: document.getElementById('trig-snapshot').value || null,
                event_type: document.getElementById('trig-event').value,
                duration_seconds: parseInt(document.getElementById('trig-duration').value)
            };

            const res = await fetch('/api/recordings/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                closeTriggerModal();
                loadData();
            } else {
                const err = await res.json();
                alert('Failed to start recording: ' + (err.detail || 'Unknown error'));
            }
        }

        async function stopRecording(deviceId) {
            await fetch('/api/recordings/stop', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ device_id: deviceId })
            });
            setTimeout(loadData, 500);
        }

        async function toggleProtect(id, protectState) {
            await fetch(`/api/recordings/${id}/protect?is_protected=${protectState}`, { method: 'POST' });
            loadData();
        }

        async function deleteRecording(id) {
            if (!confirm('Are you sure you want to delete this recording?')) return;
            await fetch(`/api/recordings/${id}`, { method: 'DELETE' });
            loadData();
        }

        async function triggerCleanup() {
            const res = await fetch('/api/cleanup', { method: 'POST' });
            const data = await res.json();
            alert(`Cleanup finished: deleted ${data.deleted_count} files, freed ${formatBytes(data.freed_bytes)}.`);
            loadData();
        }

        // Auto load and poll
        loadData();
        setInterval(loadData, 5000);
    </script>
</body>
</html>
