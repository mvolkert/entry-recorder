version: '3.8'

services:
  entry-recorder-server:
    build: .
    container_name: entry-recorder-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - RETENTION_DAYS=14
      - MAX_STORAGE_MB=20480
