name: Google Play

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore gradle.properties
        env:
          GRADLE_PROPERTIES: ${{ secrets.GRADLE_PROPERTIES }}
        shell: bash
        run: |
          mkdir -p ~/.gradle/
          echo "GRADLE_USER_HOME=${HOME}/.gradle" >> $GITHUB_ENV
          echo "${GRADLE_PROPERTIES}" > ~/.gradle/gradle.properties

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ENTRY_RECORDER_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          echo "${KEYSTORE_BASE64}" | base64 --decode > app/entry-recorder-release.jks
      - name: Validate Play service account
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          test -n "${GOOGLE_SERVICE_ACCOUNT_JSON}"
          echo "${GOOGLE_SERVICE_ACCOUNT_JSON}" | jq -e '
            .type == "service_account" and
            (.project_id | type == "string") and
            (.client_email | type == "string") and
            (.private_key | type == "string")
          ' > /dev/null

      - name: Build Android App Bundle
        env:
          ENTRY_RECORDER_STORE_FILE: app/entry-recorder-release.jks
          ENTRY_RECORDER_STORE_PASSWORD: ${{ secrets.ENTRY_RECORDER_STORE_PASSWORD }}
          ENTRY_RECORDER_KEY_ALIAS: ${{ secrets.ENTRY_RECORDER_KEY_ALIAS }}
          ENTRY_RECORDER_KEY_PASSWORD: ${{ secrets.ENTRY_RECORDER_KEY_PASSWORD }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew bundleRelease
          else
            gradle bundleRelease
          fi

      - name: Upload Android Release to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.mvolkert.entryrecorder
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: beta
          status: completed

      - name: Upload App Bundle on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/bundle/release/app-release.aab
